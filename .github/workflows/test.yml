# 雲端測試：每次推到 pending（Claude 準備好的更新）或 claude/* 分支時，
# GitHub 會開真的 Windows、Mac、Linux 電腦，跑 pytest 和完整自我測試（包含實際開視窗操作每個功能）。
# 收更新.bat 會先確認這裡全部通過，才在你的電腦上做最後的流暢度檢查並發佈。
name: 測試

on:
  push:
    branches: [pending, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            python: "3.12"
          - os: macos-latest
            label: Mac
            python: "3.12"
          - os: ubuntu-latest
            label: Linux
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      MAGIC_PERF_FACTOR: "4"        # 雲端虛擬機時間抖動大：流暢度門檻放寬；真正的門檻在你電腦上檢查
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: 安裝套件
        run: python -m pip install --upgrade pip numpy scipy pandas matplotlib openpyxl pytest

      - name: Linux 顯示環境
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk tk

      - name: pytest
        run: python -m pytest -q

      - name: 自我測試（含實際開視窗）- Windows / Mac
        if: runner.os != 'Linux'
        run: python -m magic selftest --release

      - name: 自我測試（含實際開視窗）- Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m magic selftest --release

      - name: 繁體中文 Windows 編碼（cp950 模擬）
        # 從捷徑直接開 MagicTool.pyw 時沒有 UTF-8 模式，讀寫檔案沒寫 encoding 就會用 cp950。
        # tests/cp950/sitecustomize.py 把預設編碼換成 cp950，再跑一次 pytest 與不開視窗的自我測試。
        shell: bash
        env:
          PYTHONUTF8: "0"
          PYTHONPATH: tests/cp950
        run: |
          python -X utf8=0 -m pytest -q
          python -X utf8=0 -m magic selftest --no-gui
