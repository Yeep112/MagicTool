# 效能分析（開發用）：在真的 Windows / Mac 上用 cProfile 找出切換機台與蝕刻動畫最花時間的地方。
# 推到 claude/perf* 分支，或在 Actions 頁面手動執行。不影響發佈。
name: 效能分析

on:
  push:
    branches: ["claude/perf**"]
  workflow_dispatch:

jobs:
  perf:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, label: Windows}
          - {os: macos-latest, label: Mac}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy pandas matplotlib openpyxl
      - run: python tools/perf_probe.py
