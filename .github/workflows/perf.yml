# 暫時：同一台 Windows 上 A/B 比較 v0.9.2 與目前版本的切換速度（不會合併）
name: 效能分析
on:
  push:
    branches: ["claude/perf**"]
jobs:
  ab:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, label: Windows}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy pandas matplotlib openpyxl pillow
      - name: A/B
        shell: bash
        run: |
          git worktree add ../old d68f8f2
          git worktree add ../new HEAD
          for i in 1 2 3; do
            for v in old new; do
              echo "##### RUN $v $i"
              (cd ../$v && python tools/perf_probe.py 2>&1 | awk '/^機台 /{f=1} f&&/^[A-Za-z]+ +[0-9.]+ +[0-9.]+ +[0-9.]+ +[0-9.]+$/{print} /function calls/{f=0}')
            done
          done
